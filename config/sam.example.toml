# Copy this file to config/sam.toml for this checkout. See Getting Started for
# the per-user location. API keys and other secrets do not belong in this file.
schema_version = 1

[application]
root = "."
open_ui = true

[provider]
preference = "auto" # auto, ollama, lm-studio, or openai-compatible
# model = "your-conversational-model"
# base_url = "http://127.0.0.1:1234/v1"
# local_compatible_url = "http://127.0.0.1:1234/v1"
# compatible_is_local = true

[voice]
stt_enabled = true
stt_url = "http://127.0.0.1:8080"
preferred_languages = ["en", "es"]
tts_enabled = true
tts_voice = "default"

[privacy]
allow_cloud = false

[capabilities]
workspace_write = false

# External MCP servers are optional local executors. This launch specification
# is trusted configuration; models can neither alter it nor self-authorize calls.
# [[external.mcp_servers]]
# id = "example"
# command = ["path/to/mcp-server", "--stdio"]
# working_directory = "."
# timeout_s = 20
# result_limit_bytes = 131072
