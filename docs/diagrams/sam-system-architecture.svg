<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="980" viewBox="0 0 1200 980" role="img" aria-labelledby="title desc" lang="en">
<title id="title">Sam system architecture and trust boundaries</title>
<desc id="desc">The authenticated owner interface projects state from trusted Python authority. The supervisor owns lifecycle and staged updates; TurnManager owns committed turns and immutable model routes. Capability policy mediates approved OS access. Local voice and separate private operational and reviewed-memory stores remain bounded. Runtime mediates reviewed local recall; stored claims confer no instructions or permissions. Capture and recognition return to runtime; synthesized delivery travels to local output. Models receive no direct OS, update or owner authority. Cloud use requires explicit policy.</desc>
