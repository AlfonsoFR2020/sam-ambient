<text x="76" y="122" class="body" data-estimated-width="171.18">Control / authority</text>
<path data-kind="data" d="M330,116 L356,116" fill="none" stroke="#83b8e3" stroke-width="2.3" stroke-linejoin="round" marker-end="url(#arrow-data)"/>
<text x="366" y="122" class="body" data-estimated-width="156.06">Data / projection</text>
