<text x="918" y="916" class="body" data-estimated-width="205.56">Accepted output writes</text>
<text x="918" y="940" class="body" data-estimated-width="201.42">No physical sound clock</text>
</g>
<text x="40" y="756" class="body" data-estimated-width="476.1">Completed text remains usable if speech stops or fails.</text>
</svg>
