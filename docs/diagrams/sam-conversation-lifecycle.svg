<text x="936" y="122" class="body" data-estimated-width="146.7">Optional delivery</text>
<g id="input-commit" data-kind="boundary"><rect x="20" y="150" width="1160" height="310" rx="18" fill="#17212b" stroke="#415568" stroke-width="1.3" stroke-dasharray="7 6"/>
<text x="40" y="179" class="body" style="fill: #e2b27f" data-estimated-width="245.7">INPUT &amp; CORE COMMITMENT</text>
</g>
<g id="text-generation" data-kind="boundary"><rect x="20" y="510" width="1160" height="220" rx="18" fill="#17212b" stroke="#415568" stroke-width="1.3" stroke-dasharray="7 6"/>
<text x="40" y="539" class="body" style="fill: #83b8e3" data-estimated-width="162.54">TEXT GENERATION</text>
</g>
