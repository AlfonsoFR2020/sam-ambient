<text x="338" y="362" class="card-title" data-estimated-width="167.42">Provisional STT</text>
<text x="338" y="392" class="body" data-estimated-width="119.88">en / es / auto</text>
<text x="338" y="416" class="body" data-estimated-width="162.0">Final ≠ commitment</text>
</g>
