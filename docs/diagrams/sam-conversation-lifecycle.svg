<text x="338" y="646" class="body" data-estimated-width="139.86">Model completed</text>
<text x="338" y="670" class="body" data-estimated-width="192.24">Preserved after Stop</text>
</g>
<g id="synthesis" data-kind="node" data-bounds="610 560 230 135"><rect x="610" y="560" width="230" height="135" rx="11" fill="#202d39" stroke="#415568" stroke-width="1.1"/><path d="M625,561 H825" stroke="#76cbbb" stroke-width="2"/>
<text x="628" y="592" class="card-title" data-estimated-width="165.88">Prepare speech</text>
<text x="628" y="622" class="body" data-estimated-width="187.38">WAV / PCM synthesis</text>
<text x="628" y="646" class="body" data-estimated-width="185.76">No text regeneration</text>
<text x="628" y="670" class="body" data-estimated-width="185.22">May fail / be stopped</text>
