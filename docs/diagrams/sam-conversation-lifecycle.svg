<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1000" viewBox="0 0 1200 1000" role="img" aria-labelledby="title desc" lang="en">
<title id="title">Sam development conversation, recognition and delivery lifecycle</title>
<desc id="desc">Text enters authenticated command admission; ACK is not commitment or readiness. Microphone PCM and VAD feed provisional recognition. Core commitment establishes turn, generation and cancellation ownership and a frozen exact inference route. Completed written text and optional synthesized/playback delivery have separate lifetimes. Accepted PCM writes drive visual observations, not acoustic timestamps. Cancellation and terminal failures reject late work and preserve typed recovery.</desc>
<defs>
<marker id="arrow-control" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,4.5 L0,9 Z" fill="#e2b27f"/></marker>
<marker id="arrow-data" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,4.5 L0,9 Z" fill="#83b8e3"/></marker>
<marker id="arrow-delivery" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,4.5 L0,9 Z" fill="#76cbbb"/></marker>
<marker id="arrow-warning" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,4.5 L0,9 Z" fill="#edaaa2"/></marker>
</defs>
<style>
text { font-family: "Segoe UI", Inter, Arial, sans-serif; }
.title { fill: #f4eee5; font-size: 36px; font-weight: 650; }
.body { fill: #bbc9d5; font-size: 18px; }
.card-title { fill: #f4eee5; font-size: 22px; font-weight: 600; }
</style>
<rect width="1200" height="1000" fill="#10161c"/>
<text x="40" y="51" class="title" data-estimated-width="651.96">Conversation / recognition / delivery</text>
<text x="40" y="83" class="body" data-estimated-width="715.86">Development lifecycle • recognition is evidence; text and speech finish separately.</text>
