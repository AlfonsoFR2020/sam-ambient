[package]
name = "sam-native-shell"
version = "0.1.2"
description = "Thin native application shell for Sam"
authors = ["Alfonso Ernesto de la Fuente Ruiz, PhD"]
license = "Apache-2.0"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "sam_native_shell_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }

[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-single-instance = "2"
