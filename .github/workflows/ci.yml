name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: Quality (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install Python dependencies
        run: uv sync --locked

      - name: Python lint and format
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Python tests
        run: uv run pytest

      - name: Verify source version consistency
        run: uv run python scripts/check_release.py

      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml

      - name: Install frontend dependencies
        working-directory: ui
        run: pnpm install --frozen-lockfile

      - name: Frontend quality and build
        working-directory: ui
        run: |
          pnpm test
          pnpm lint
          pnpm typecheck
          pnpm build

  package:
    name: Package smoke
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml

      - name: Build production distributions
        shell: bash
        run: |
          uv sync --locked
          pnpm --dir ui install --frozen-lockfile
          bash scripts/package.sh

      - name: Verify version and installed CLI
        shell: bash
        run: |
          uv run python scripts/check_release.py --dist
          uv venv .package-smoke
          uv pip install --python .package-smoke/bin/python dist/*.whl
          .package-smoke/bin/sam --version
          .package-smoke/bin/python -c "import importlib.metadata as m; from sam_ambient import __version__; assert m.version('sam-ambient') == __version__"
