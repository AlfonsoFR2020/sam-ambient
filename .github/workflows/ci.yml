name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: Quality (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install Python dependencies
        run: uv sync --locked

      - name: Python lint and format
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Python tests
        run: uv run pytest

      - name: Verify source version consistency
        run: uv run python scripts/check_release.py

      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml

      - name: Install frontend dependencies
        working-directory: ui
        run: pnpm install --frozen-lockfile

      - name: Frontend quality and build
        working-directory: ui
        run: |
          pnpm test
          pnpm lint
          pnpm typecheck
          pnpm build

  package:
    name: Package smoke
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml

      - name: Build production distributions
        shell: bash
        run: |
          uv sync --locked
          pnpm --dir ui install --frozen-lockfile
          bash scripts/package.sh

      - name: Verify version and installed CLI
        shell: bash
        run: |
          uv run python scripts/check_release.py --dist
          uv venv .package-smoke
          uv pip install --python .package-smoke/bin/python dist/*.whl
          .package-smoke/bin/sam --version
          .package-smoke/bin/python -c "import importlib.metadata as m; from sam_ambient import __version__; assert m.version('sam-ambient') == __version__"

  native-shell:
    name: Native package (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml

      - name: Configure hosted Windows Rust toolchain
        run: |
          rustup default stable
          rustup component add rustfmt

      - name: Install native package dependencies
        run: |
          uv sync --locked --group package
          pnpm --dir ui install --frozen-lockfile

      - name: Rust format
        run: |
          cargo fmt --manifest-path ui/src-tauri/Cargo.toml -- --check

      - name: Build self-contained companion
        shell: pwsh
        run: |
          $buildRoot = Join-Path $env:RUNNER_TEMP "sam-native-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          New-Item -ItemType Directory -Path $buildRoot | Out-Null
          $companion = Join-Path $buildRoot "companion"
          $env:APPDATA = Join-Path $buildRoot "appdata"
          uv run --group package python scripts/build_native_companion.py --output $companion
          $manifest = Get-Content -Raw (Join-Path $companion "companion-manifest.json") | ConvertFrom-Json
          if ($manifest.component -ne "sam-native-companion") { throw "invalid companion manifest" }
          uv run python scripts/smoke_native_companion.py `
            --companion (Join-Path $companion "sam-supervisor.exe") `
            --data-root (Join-Path $buildRoot "smoke-data")
          "SAM_NATIVE_BUILD_ROOT=$buildRoot" | Out-File -FilePath $env:GITHUB_ENV -Append
          "SAM_NATIVE_COMPANION=$companion" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Assemble NSIS package
        shell: pwsh
        run: |
          ./scripts/package_native.ps1 `
            -BuildRoot $env:SAM_NATIVE_BUILD_ROOT `
            -CompanionDirectory $env:SAM_NATIVE_COMPANION `
            -AllowUnsignedDevelopmentBuild `
            -SkipDistCopy
