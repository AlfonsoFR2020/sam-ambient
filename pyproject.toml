[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "zev-ambient"
version = "0.1.0"
description = "Sam: a local-first ambient voice computer interface"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
sam = "zev_ambient.cli:main"
zev-ambient = "zev_ambient.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3,<9",
    "ruff>=0.11,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/zev_ambient"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers -p no:cacheprovider"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "RUF"]
